services:
  caddy:
    profiles: [production]

  site:
    image: personal-knowledge-journal:dev
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    environment:
      CONTENT_SOURCE: fixture
      NODE_ENV: development
      SITE_URL: http://localhost:4321
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - type: bind
        source: ..
        target: /app
      - site_node_modules:/app/node_modules
    read_only: false

  directus:
    environment:
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
    ports:
      - "127.0.0.1:8055:8055"
    volumes:
      - type: bind
        source: ../directus
        target: /directus/project
        read_only: false

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks: [web, data]

volumes:
  site_node_modules:
