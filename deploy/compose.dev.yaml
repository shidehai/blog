services:
  caddy:
    profiles: [production]

  site:
    image: personal-knowledge-journal:dev
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    command:
      [
        "pnpm",
        "--filter",
        "frontend-v2",
        "dev",
        "--hostname",
        "0.0.0.0",
        "--port",
        "4321",
      ]
    environment:
      CONTENT_SOURCE: ${CONTENT_SOURCE:-fixture}
      SITE_URL: http://localhost:4321
      CMS_INTERNAL_URL: http://cms:4322
      CMS_READ_TOKEN: ${CMS_READ_TOKEN:?Set CMS_READ_TOKEN}
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - type: bind
        source: ..
        target: /app
      - site_node_modules:/app/node_modules
      - site_frontend_node_modules:/app/frontend-v2/node_modules
    read_only: false

  cms:
    image: personal-journal-cms:dev
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    command: ["pnpm", "--filter", "author-cms", "dev", "--hostname", "0.0.0.0"]
    environment:
      CMS_ORIGIN: http://localhost:4322
      CMS_SITE_ORIGIN: http://localhost:4321
      CMS_MEDIA_ROOT: /data/cms-media
    ports: ["127.0.0.1:4322:4322"]
    volumes:
      - type: bind
        source: ..
        target: /app
      - site_node_modules:/app/node_modules
      - cms_node_modules:/app/author-cms/node_modules
    read_only: false

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks: [web, data]

volumes:
  site_node_modules:
  site_frontend_node_modules:
  cms_node_modules:
