x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
      cms:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${BLOG_DATA_ROOT:-../.data}/caddy/data
        target: /data
      - type: bind
        source: ${BLOG_DATA_ROOT:-../.data}/caddy/config
        target: /config
      - type: bind
        source: ${BLOG_DATA_ROOT:-../.data}/caddy/logs
        target: /var/log/caddy
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  site:
    environment:
      CONTENT_SOURCE: cms
      SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      CMS_INTERNAL_URL: http://cms:4322
      CMS_READ_TOKEN: ${CMS_READ_TOKEN:?Set CMS_READ_TOKEN}
    image: ${SITE_IMAGE:?Set SITE_IMAGE to an immutable digest}
    restart: unless-stopped
    init: true
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  cms:
    image: ${CMS_IMAGE:?Set CMS_IMAGE to an immutable digest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${CMS_DATABASE_URL:?Set CMS_DATABASE_URL}
      CMS_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      CMS_SITE_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      CMS_READ_TOKEN: ${CMS_READ_TOKEN:?Set CMS_READ_TOKEN}
      CMS_MEDIA_ROOT: /data/cms-media
      CMS_TRUST_PROXY: "false"
    volumes:
      - type: bind
        source: ${BLOG_DATA_ROOT:-../.data}/cms/media
        target: /data/cms-media
    networks: [web, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4322/admin/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${BLOG_DATA_ROOT:-../.data}/postgres
        target: /var/lib/postgresql/data
    networks: [data]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    profiles: [backup]
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_HOST: ${BACKUP_HOST:-personal-journal-vps}
      BACKUP_TAG: ${BACKUP_TAG:-personal-journal}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      RESTIC_CACHE_DIR: /tmp/restic-cache
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY}
    volumes:
      - type: bind
        source: ${BLOG_DATA_ROOT:-../.data}/cms/media
        target: /data/cms-media
        read_only: true
      - type: bind
        source: ${BLOG_DATA_ROOT:-../.data}/backup-staging
        target: /backup-staging
    networks: [data, backup-egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  restore:
    profiles: [restore]
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    entrypoint: ["/usr/local/bin/blog-restore"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_HOST: ${BACKUP_HOST:-personal-journal-vps}
      BACKUP_TAG: ${BACKUP_TAG:-personal-journal}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      RESTIC_CACHE_DIR: /tmp/restic-cache
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
      RESTORE_CMS_MEDIA_TARGET: /restore/cms-media
    volumes:
      - type: bind
        source: ${BLOG_DATA_ROOT:-../.data}/cms/media
        target: /restore/cms-media
      - type: bind
        source: ${BLOG_DATA_ROOT:-../.data}/backup-staging
        target: /backup-staging
    networks: [data, backup-egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  restic-maintenance:
    profiles: [maintenance]
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    entrypoint: ["/usr/local/bin/restic-maintenance"]
    restart: "no"
    environment:
      BACKUP_HOST: ${BACKUP_HOST:-personal-journal-vps}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-86400}
      BACKUP_TAG: ${BACKUP_TAG:-personal-journal}
      RESTIC_CACHE_DIR: /tmp/restic-cache
      RESTIC_CHECK_SUBSET: ${RESTIC_CHECK_SUBSET:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY}
    networks: [backup-egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

networks:
  web: {}
  backup-egress: {}
  data:
    internal: true
