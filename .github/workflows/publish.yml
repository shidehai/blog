name: Validate and publish site

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [directus-publish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.event.pull_request.number || 'production'
    }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and container contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dca151540d0c3c1c0b0a01711d1 # v4.0.3
        with:
          node-version: 24.15.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run application quality gate
        run: pnpm verify

      - name: Validate Compose, Caddy, and operations image
        env:
          OPS_BUILD_IMAGES: "1"
        run: sh scripts/validate-operations.sh

      - name: Build fixture runtime image
        run: docker build --target runtime --tag blog-site:fixture .

      - name: Exercise fixture runtime image
        run: scripts/test-runtime-image.sh blog-site:fixture

  publish:
    name: Build immutable image and deploy
    needs: quality
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate production inputs
        env:
          DIRECTUS_BUILD_TOKEN: ${{ secrets.DIRECTUS_BUILD_TOKEN }}
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
        run: |
          test -n "$DIRECTUS_BUILD_TOKEN"
          test -n "$DIRECTUS_URL"

      - name: Build published snapshot image
        id: build
        env:
          DIRECTUS_BUILD_TOKEN: ${{ secrets.DIRECTUS_BUILD_TOKEN }}
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
        run: |
          image_repository=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image_tag="$image_repository:sha-$GITHUB_SHA"
          docker build \
            --target runtime \
            --secret id=directus_build_token,env=DIRECTUS_BUILD_TOKEN \
            --build-arg CONTENT_SOURCE=directus \
            --build-arg DIRECTUS_URL="$DIRECTUS_URL" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$image_tag" \
            .
          scripts/test-runtime-image.sh "$image_tag"
          scripts/assert-image-secret-free.sh "$image_tag"
          echo "image_repository=$image_repository" >>"$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >>"$GITHUB_OUTPUT"

      - name: Scan runtime image for high and critical vulnerabilities
        env:
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.65.0 \
            image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln --no-progress "$IMAGE_TAG"

      - name: Push image and resolve registry digest
        id: registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REPOSITORY: ${{ steps.build.outputs.image_repository }}
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          digest_hex=${digest#sha256:}
          test "$digest" != "$digest_hex"
          test "${#digest_hex}" -eq 64
          case "$digest_hex" in *[!0-9a-f]*) exit 1 ;; esac
          image_ref="$IMAGE_REPOSITORY@$digest"
          echo "image_ref=$image_ref" >>"$GITHUB_OUTPUT"

      - name: Deploy through forced SSH command
        env:
          IMAGE_REF: ${{ steps.registry.outputs.image_ref }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_DEPLOY_TARGET: ${{ secrets.VPS_DEPLOY_TARGET }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_DEPLOY_KEY"
          test -n "$VPS_DEPLOY_TARGET"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" >"$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_DEPLOY_TARGET" \
            "$IMAGE_REF"
