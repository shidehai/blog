name: Validate and publish site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.0

concurrency:
  # push/PR 的 quality 运行可被后续 push 取消；发布运行独占 production-publish
  # 组且不可取消，普通 push 不会中断进行中的部署。
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || github.event_name == 'push' && 'main-quality'
      || 'production-publish'
    }}
  cancel-in-progress: >-
    ${{
      github.event_name != 'workflow_dispatch'
    }}

jobs:
  quality:
    name: Quality and container contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_DB: author_cms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CMS_TEST_DATABASE_URL: postgres://postgres:isolated-ci-test-password@127.0.0.1:55432/author_cms_test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dca151540d0c3c1c0b0a01711d1 # v4.0.3
        with:
          node-version: 24.22.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run application quality gate
        run: pnpm verify

      - name: Install isolated browser regression runtime
        run: pnpm --filter author-cms exec playwright install --with-deps chromium

      - name: Verify immediate publishing and native browser interactions
        run: xvfb-run --auto-servernum pnpm test:runtime --browser

      - name: Validate Compose, Caddy, and operations image
        env:
          OPS_BUILD_IMAGES: "1"
        run: sh scripts/validate-operations.sh

      - name: Build site runtime image
        run: docker build --target runtime --tag blog-site:fixture .

      - name: Exercise fixture runtime image
        run: scripts/test-runtime-image.sh blog-site:fixture

      - name: Build CMS runtime image
        run: docker build --target cms-runtime --tag blog-cms:test .

      - name: Exercise CMS image and restricted database role
        run: sh scripts/test-cms-image.sh blog-cms:test

      - name: Inspect images for embedded runtime credentials
        env:
          CMS_READ_TOKEN: isolated-inspection-token-not-used-at-build
        run: |
          scripts/assert-image-secret-free.sh blog-site:fixture
          scripts/assert-image-secret-free.sh blog-cms:test

      - name: Scan both runtime images for high and critical vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          for image in blog-site:fixture blog-cms:test; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln --no-progress "$image"
          done

  publish:
    name: Build immutable image and deploy
    needs: quality
    # 普通 push 到 main 只跑 quality 门禁；发布仅限手动触发
    # （Actions 页面 Run workflow）。内容发布由 CMS 事务直接更新。
    if: >-
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build code images without CMS credentials
        id: build
        run: |
          image_repository=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image_tag="$image_repository:sha-$GITHUB_SHA"
          cms_repository="$image_repository-cms"
          cms_tag="$cms_repository:sha-$GITHUB_SHA"
          docker build --target runtime --label org.opencontainers.image.revision="$GITHUB_SHA" --tag "$image_tag" .
          docker build --target cms-runtime --label org.opencontainers.image.revision="$GITHUB_SHA" --tag "$cms_tag" .
          scripts/test-runtime-image.sh "$image_tag"
          CMS_READ_TOKEN=isolated-image-inspection-token-32-characters scripts/assert-image-secret-free.sh "$image_tag"
          CMS_READ_TOKEN=isolated-image-inspection-token-32-characters scripts/assert-image-secret-free.sh "$cms_tag"
          echo "image_repository=$image_repository" >>"$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >>"$GITHUB_OUTPUT"
          echo "cms_repository=$cms_repository" >>"$GITHUB_OUTPUT"
          echo "cms_tag=$cms_tag" >>"$GITHUB_OUTPUT"

      - name: Scan runtime image for high and critical vulnerabilities
        env:
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
          CMS_TAG: ${{ steps.build.outputs.cms_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          for image in "$IMAGE_TAG" "$CMS_TAG"; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln --no-progress "$image"
          done

      - name: Push image and resolve registry digest
        id: registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REPOSITORY: ${{ steps.build.outputs.image_repository }}
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
          CMS_TAG: ${{ steps.build.outputs.cms_tag }}
          CMS_REPOSITORY: ${{ steps.build.outputs.cms_repository }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_TAG"
          docker push "$CMS_TAG"
          cms_digest=$(docker buildx imagetools inspect "$CMS_TAG" --format '{{.Manifest.Digest}}')
          echo "CMS image for reviewed rollout: $CMS_REPOSITORY@$cms_digest"
          digest=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          digest_hex=${digest#sha256:}
          test "$digest" != "$digest_hex"
          test "${#digest_hex}" -eq 64
          case "$digest_hex" in *[!0-9a-f]*) exit 1 ;; esac
          image_ref="$IMAGE_REPOSITORY@$digest"
          echo "image_ref=$image_ref" >>"$GITHUB_OUTPUT"

      - name: Deploy through forced SSH command
        env:
          IMAGE_REF: ${{ steps.registry.outputs.image_ref }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_DEPLOY_TARGET: ${{ secrets.VPS_DEPLOY_TARGET }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_DEPLOY_KEY"
          test -n "$VPS_DEPLOY_TARGET"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" >"$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_DEPLOY_TARGET" \
            "$IMAGE_REF"
